name: CCP Windows x64 Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CCP Scan version"
        required: true
        default: "0.2.4"
  push:
    branches:
      - feature/mixed-paper-scan
    paths:
      - "CCP.Setup/**"
      - "NAPS2.App.WinForms/NAPS2.App.WinForms.csproj"
      - "NAPS2.Lib.WinForms/EtoForms/Ui/CcpWinFormsDesktopForm.cs"
      - ".github/workflows/ccp-windows-setup.yml"

jobs:
  build-setup:
    name: Build Win64 Setup
    runs-on: windows-latest
    env:
      CCP_VERSION: ${{ inputs.version || '0.2.4' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build CCP Win64 installer
        shell: powershell
        run: |
          .\CCP.Setup\build-setup.ps1 -Version "$env:CCP_VERSION"

      - name: Verify Pdfium is packaged
        shell: powershell
        run: |
          if (-not (Test-Path .\CCP.Setup\publish\win-x64\win64\pdfium.dll)) {
            throw "win64\\pdfium.dll is missing from publish output"
          }

      - name: List generated installer
        shell: powershell
        run: |
          Get-ChildItem .\CCP.Setup\publish\setup\*Win64.exe | Select-Object Name, Length, FullName

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: CCP-Scan-Windows-x64-Setup-${{ env.CCP_VERSION }}
          path: CCP.Setup/publish/setup/*Win64.exe
          if-no-files-found: error
          retention-days: 30
