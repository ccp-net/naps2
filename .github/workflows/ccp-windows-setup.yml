name: CCP Windows x64 Build + Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CCP Scan version"
        required: true
        default: "0.2.7"
  push:
    branches:
      - feature/mixed-paper-scan

jobs:
  build-setup:
    name: Windows x64 Build + Setup
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CCP_VERSION: ${{ inputs.version || '0.2.7' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows x64 app
        shell: powershell
        run: |
          dotnet restore .\NAPS2.App.WinForms\NAPS2.App.WinForms.csproj -r win-x64

      - name: Build Windows x64 app
        shell: powershell
        run: |
          dotnet build .\NAPS2.App.WinForms\NAPS2.App.WinForms.csproj -c Release -r win-x64 --no-restore

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build CCP Win64 installer
        shell: powershell
        run: |
          .\CCP.Setup\build-setup.ps1 -Version "$env:CCP_VERSION"

      - name: Verify PDFium native assets and prerequisites
        shell: powershell
        run: |
          $paths = @(
            ".\CCP.Setup\publish\win-x64\lib\_win64\pdfium.dll",
            ".\CCP.Setup\publish\win-x64\_win64\pdfium.dll",
            ".\CCP.Setup\publish\win-x64\win64\pdfium.dll"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "Missing required PDFium native asset: $path" }
          }
          if (-not (Test-Path ".\CCP.Setup\cache\vc_redist.x64.exe")) {
            throw "Missing VC++ x64 prerequisite"
          }
          if (-not (Test-Path ".\CCP.Setup\publish\win-x64\favicon.ico")) {
            throw "Missing installed CCP favicon.ico"
          }

      - name: Smoke test PDFium native load
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class CcpNativeSmoke {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryExW(string fileName, IntPtr hFile, uint flags);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr module);
          }
          "@
          $pdfium = (Resolve-Path ".\CCP.Setup\publish\win-x64\win64\pdfium.dll").Path
          $handle = [CcpNativeSmoke]::LoadLibraryExW($pdfium, [IntPtr]::Zero, [uint32]0x00001100)
          if ($handle -eq [IntPtr]::Zero) {
              $code = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "PDFium LoadLibraryEx smoke test failed with Win32 error $code"
          }
          [CcpNativeSmoke]::FreeLibrary($handle) | Out-Null
          Write-Host "PDFium native load smoke test passed." -ForegroundColor Green

      - name: Verify generated installer
        shell: powershell
        run: |
          $installer = Get-ChildItem .\CCP.Setup\publish\setup\*Win64.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "CCP Win64 installer was not generated" }
          $installer | Select-Object Name, Length, FullName

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: CCP-Scan-Windows-x64-Setup-${{ env.CCP_VERSION }}
          path: CCP.Setup/publish/setup/*Win64.exe
          if-no-files-found: error
          retention-days: 30
